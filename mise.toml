[tools]
node = "lts"
# The C build is generated by scripts/gen-ninja.ts and executed by ninja, which
# is what gets us compiler-derived header dependencies (-MMD) instead of the
# hand-maintained dependency lists the old bash scripts carried.
ninja = "latest"

# ---------------------------------------------------------------------------
# Naming
#
#   <thing>-build     produces an artifact          (host-build, move-build, wasm-build)
#   test-<thing>      runs a test suite             (test-c, test-c-san, test-web, ...)
#   move-<verb>       acts on the device            (move-install, move-deploy, move-health, ...)
#
# Deliberately NOT cached with mise `sources`/`outputs`. Every build task is a
# thin wrapper over ninja, which already tracks staleness per translation unit
# and per header. A second, coarser glob-based cache layered on top could only
# ever be wrong in one direction — skipping a build that was actually needed —
# and the artifact it would skip rebuilding is the one that ships to hardware.
# `mise run move-build` on an unchanged tree is already ~0.6s.
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install local Python dev dependencies"
run = "python3 -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt"

# --- codegen ---------------------------------------------------------------
#
# module.def.json is the source of truth, but only gen-module-json reads it: the
# rest read the module.json it emits. So they have to run after it, and that
# ordering is a `depends` rather than a line in a doc — running `gen-params`
# alone after editing a definition otherwise emits C from the stale manifest,
# and nothing says so until `validate` reports drift much later.

[tasks.gen-module-json]
description = "Generate each module.json for the Schwung target from its module.def.json"
run = "node scripts/gen-module-json.ts"

[tasks.gen-params]
description = "Generate <module>_params.gen.inc files from each module.json"
depends = ["gen-module-json"]
run = "pnpm run gen-params"

[tasks.gen-faust]
description = "Generate <module>_faust.c from <module>.dsp for Faust-backed modules"
run = "pnpm run gen-faust"

[tasks.gen-presets]
description = "Generate <module>_presets.gen.inc files from presets.json"
depends = ["gen-module-json"]
run = "pnpm run gen-presets"

[tasks.gen-ui-chain]
description = "Generate <module>/ui_chain.js (chain-slot param editor) from each module.json"
depends = ["gen-module-json"]
run = "pnpm run gen-ui-chain"

[tasks.gen-ninja]
description = "Generate build/{host,move,wasm}.ninja from the module graph"
run = "node scripts/gen-ninja.ts"

[tasks.gen-compile-commands]
description = "Generate compile_commands.json for clangd / libclang tooling"
run = "pnpm run gen-compile-commands"

# --- build -----------------------------------------------------------------
#
# Each of these regenerates the ninja files first, so adding a module or a
# parameter never needs a separate `mise run gen-ninja`.

[tasks.host-build]
description = "Build host-only shared libraries into dist-host/ for local compile checks"
run = "node scripts/build-host.ts"

[tasks.move-build]
description = "Cross-compile aarch64 .so and package dist/<id>/ + dist/<id>-module.tar.gz"
run = "node scripts/build-move.ts"

[tasks.web-build]
# In `check` because nothing else there loads vite.config.ts. It went unparseable
# for a whole commit — a template literal with unescaped backticks, plus an
# esbuild shebang rejection — and neither `check` nor CI noticed, because the
# only thing that built the web UI was the Pages deploy, on main, after merge.
# This needs no Playwright download, so it costs a DSP-only developer a few
# seconds rather than a browser install.
#
# It does not need WASM: with web/wasm empty the build warns and still exercises
# the config, the TypeScript and the asset copy, which is the part that breaks.
description = "Build the static browser UI into web/dist (catches vite config and web TypeScript breaks)"
run = "pnpm run build:web"

[tasks.wasm-build]
description = "Emscripten-compile browser .wasm into web/wasm/"
run = "node scripts/build-wasm.ts"

[tasks.render-build]
description = "Build the offline render/trace harness binaries only"
run = "ninja -f build/host.ninja renders"
depends = ["gen-ninja"]

# --- test ------------------------------------------------------------------

[tasks.typecheck]
description = "Typecheck the TypeScript in scripts/, shared/ and web/"
run = "pnpm run typecheck"

[tasks.validate]
description = "Validate module-scoped parameter metadata and check gen.inc is in sync"
run = "pnpm run validate"

[tasks.test-c]
description = "Compile and run the C core/plugin tests"
run = "node scripts/gen-ninja.ts && ninja -f build/host.ninja tests"

[tasks.test-c-san]
# Worth the ~2x runtime: the modules carry fixed-size ring buffers indexed by
# computed offsets, Faust adapters write through zone pointers held in
# hand-sized arrays, and there are float->int conversions at every audio
# boundary. Those are exactly ASan/UBSan's targets, and none are visible to a
# plain -O2 build or to the metric checks.
description = "Re-run the C tests under AddressSanitizer + UndefinedBehaviorSanitizer"
run = "node scripts/gen-ninja.ts && ninja -f build/host.ninja tests-san"

[tasks.test-web]
description = "Run Vitest browser-mode component tests for the React web UI"
run = "pnpm test"

[tasks.test-ui-chain]
description = "Run local chain-UI behaviour tests (generated ui_chain.js, no device)"
run = "pnpm run test:ui-chain"

[tasks.test]
# Everything test-shaped, including the browser suite. `check` depends on
# `web-build` but not on `test-web`: the build catches a broken web config for
# free, while the browser suite needs a Playwright download that a DSP-only
# developer should not have to pay for. CI runs test-web in its own job, so it
# is gated — just not locally.
description = "Run every test suite: C, C+sanitizers, chain UI, and the browser components"
depends = ["test-c", "test-c-san", "test-ui-chain", "test-web"]

# --- render / audition -----------------------------------------------------

[tasks.render]
description = "Render the default demo WAV for each module"
run = "node scripts/render.ts"

[tasks.suite]
description = "Render all preset-suite WAVs"
run = "node scripts/render.ts --suite"

[tasks.stress]
description = "Render metadata-generated min/max stress WAVs and check safety metrics"
run = ["node scripts/render.ts --stress", "pnpm run check-stress"]

[tasks.stress-all]
# With MODULE_ID unset, `stress` already covers every audio module — the -all
# variants only existed because the Makefile looped modules by hand.
description = "Alias for `stress`, which already covers every audio module"
depends = ["stress"]

[tasks.plot]
description = "Generate waveform/spectrum PNGs from the current renders"
run = ".venv/bin/python tools/plot_renders.py"

[tasks.plot-stress]
description = "Render stress WAVs and generate waveform/spectrum PNGs"
run = [
  "node scripts/render.ts --stress",
  "PLOT_SUITE=stress .venv/bin/python tools/plot_renders.py",
  "pnpm run check-stress",
]

[tasks.plot-stress-all]
description = "Alias for `plot-stress`, which already covers every audio module"
depends = ["plot-stress"]

[tasks.metrics]
description = "Render the suite and emit metrics.json next to WAVs"
depends = ["suite"]
run = "pnpm run metrics"

[tasks.check-renders]
description = "Compare current suite metrics against goldens/<module>/metrics.json"
run = "pnpm run check-renders"

[tasks.bless-renders]
description = "Promote current suite metrics into goldens/<module>/metrics.json"
run = "pnpm run bless-renders"

[tasks.palette]
# Depends on `render` for the same reason `dev` depends on `wasm-build`: without
# it the report is generated from whatever binary happened to be lying in build/,
# so a DSP change reads as "did nothing" rather than as a stale build. That is
# exactly the failure this tool exists to catch, and it caught it on itself first.
description = "Audition a module: per-voice, per-knob and per-preset sonic report (HTML + Markdown)"
depends = ["render"]
run = "node scripts/palette.ts"

# --- browser ---------------------------------------------------------------

[tasks.serve]
description = "Serve the local browser UI at http://localhost:8765/ (no WASM rebuild)"
run = "pnpm run serve"

[tasks.web]
description = "Build WASM and serve the browser UI"
depends = ["wasm-build"]
run = "pnpm run serve"

[tasks.dev]
# Vite watches the TypeScript tree and nothing else, so a DSP change reaches the
# browser only through wasm-build. Without the dependency this task served a
# stale .wasm indefinitely while claiming in its own description to have rebuilt
# it — which reads as "the DSP change did nothing" rather than as a build
# problem. Editing C during a session is handled by vite.config.ts, which reruns
# the wasm build on save.
description = "Build WASM, then serve the browser UI with TypeScript rebuilt on change"
depends = ["wasm-build"]
run = "pnpm run dev"

# --- device ----------------------------------------------------------------

[tasks.move-install]
# Build then copy, with no test gate: the fast hardware iteration loop.
# move-build is ninja-backed, so an unchanged tree adds well under a second.
description = "Build and copy module(s) to Ableton Move, without running the check gate"
depends = ["move-build"]
run = "./scripts/install-to-move.sh"

[tasks.move-deploy]
# The safe path: the full gate, then a fresh build, then the copy. `depends` runs
# both before `run`, and move-build is idempotent, so the install always ships
# the artifact `check` just validated.
description = "Run the full check gate, then build and install to Ableton Move"
depends = ["check", "move-build"]
run = "./scripts/install-to-move.sh"

[tasks.move-health]
description = "Check SSH, Schwung paths, disk space, and installed module files on Ableton Move"
run = "./scripts/move-health.sh"

[tasks.move-logs]
description = "Tail Schwung debug.log on Ableton Move"
run = "./scripts/tail-move-log.sh"

[tasks.move-cache]
description = "Clear transient Schwung/Move runtime caches on Ableton Move"
run = "./scripts/clear-move-cache.sh"

[tasks.move-restart]
description = "Ask Schwung's restart helper to restart Move"
run = "./scripts/restart-move.sh"

[tasks.move-screen]
description = "Capture the Move/Schwung screen endpoint with Playwright"
run = "node scripts/capture-move-screen.ts"

# --- gates -----------------------------------------------------------------

[tasks.check]
# The one non-device gate. It must exit 0 before anything ships.
#
# typecheck, validate and test-ui-chain are independent of each other and of the
# C build, so they run as parallel dependencies. The rest is ordered — `suite`
# has to render before `check-renders` can compare — and stays a sequential list
# so the gate reads in the order it runs. With MODULE_ID unset every step covers
# all modules, so there is nothing for a separate check-all to add.
description = "Run the main non-device checks — the gate that must pass before shipping"
depends = ["typecheck", "validate", "test-ui-chain"]
run = [
  "mise run test-c",
  "mise run test-c-san",
  "mise run suite",
  "mise run check-renders",
  "mise run stress",
  "mise run plot",
  "mise run host-build",
  "mise run web-build",
]

[tasks.check-all]
description = "Alias for `check`, which already covers every module"
depends = ["check"]

[tasks.check-gcc]
# Apple clang does not implement -Wformat-truncation, so a whole class of -Werror
# failure is invisible locally: `check` passes and CI fails on the same source.
description = "Compile every C test with a real GCC (Docker), under both flag sets CI uses"
run = "./scripts/check-gcc.sh"

# --- misc ------------------------------------------------------------------

[tasks.new-module]
description = "Scaffold a new Schwung module (Faust by default for synth/FX; use --dsp c for fallback)"
run = "pnpm run new-module --"

[tasks.format]
description = "Format hand-written C with clang-format"
run = "pnpm run format"

[tasks.format-check]
description = "Check hand-written C formatting without rewriting"
run = "pnpm run format-check"

[tasks.clean]
description = "Remove build/, build-host/, dist/, dist-host/, rendered plots, and browser WASM"
run = "rm -rf build build-host dist dist-host renders/plots web/wasm/*.wasm"
